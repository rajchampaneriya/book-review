# Cluster-level collector (platform plan section 3.1): object state via
# the k8s_cluster receiver — node/deployment/replicaset/job counts,
# conditions and phases — forwarded to lgtm.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-cluster
  namespace: wcf-physics
  labels:
    app.kubernetes.io/name: otel-cluster
    app.kubernetes.io/part-of: wcf-physics
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-cluster
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-cluster
        wcf-physics.io/identity: otel-cluster
    spec:
      serviceAccountName: otel-cluster
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: collector
          image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.163.1
          args: ["--config=/conf/otel-cluster.yaml"]
          env:
            # sql_query receiver: the same local-development Secret the
            # booking stacks and the audit use.
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: postgres-local
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-local
                  key: POSTGRES_PASSWORD
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: postgres-local
                  key: POSTGRES_DB
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: conf
              mountPath: /conf
              readOnly: true
      volumes:
        - name: conf
          configMap:
            name: otel-cluster-conf
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-cluster-conf
  namespace: wcf-physics
data:
  otel-cluster.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    receivers:
      k8s_cluster:
        collection_interval: 30s
        auth_type: serviceAccount
      sql_query:
        # duplicate-audit counts (platform plan section 3.1): the same query
        # the duplicate-audit CronJob reports to its logs, as a metric.
        driver: postgres
        datasource: "host=postgres.wcf-physics.svc port=5432 user=${env:PGUSER} password=${env:PGPASSWORD} dbname=${env:PGDATABASE} sslmode=disable"
        collection_interval: 5m
        queries:
          - sql: >-
              select stack, duplicate_bookings from (
                select 'dotnet' as stack, count(*) - count(distinct client_ref) as duplicate_bookings from dotnet.bookings
                union all
                select 'java', count(*) - count(distinct client_ref) from java.bookings
                union all
                select 'python', count(*) - count(distinct client_ref) from python.bookings
              ) audit
            metrics:
              - metric_name: duplicate_bookings
                value_column: duplicate_bookings
                attribute_columns: [stack]
                description: "bookings_total - count(distinct client_ref) per stack schema, from the duplicate audit"

    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 480
      batch: {}

    exporters:
      otlp/lgtm:
        endpoint: lgtm:4317
        tls:
          insecure: true

    service:
      extensions: [health_check]
      pipelines:
        metrics:
          receivers: [k8s_cluster, sql_query]
          processors: [memory_limiter, batch]
          exporters: [otlp/lgtm]
