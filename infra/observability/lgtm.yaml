# grafana/otel-lgtm: one pod with Grafana, a Prometheus-compatible store,
# Tempo and Loki (platform plan D5). Grafana on NodePort 30091 (host 8091).
# The image is for development, demos and testing — right for one k3d node.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lgtm
  namespace: wcf-physics
  labels:
    app.kubernetes.io/name: lgtm
    app.kubernetes.io/part-of: wcf-physics
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lgtm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lgtm
        wcf-physics.io/identity: lgtm
    spec:
      serviceAccountName: default
      containers:
        - name: lgtm
          image: grafana/otel-lgtm:0.37.0
          env:
            - name: GF_SERVER_ROOT_URL
              value: http://localhost:8091
          ports:
            - name: grafana
              containerPort: 3000
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
              readOnly: true
            # the image launches the grafana binary directly, so provisioning
            # lives under its home conf/, not /etc/grafana/provisioning
            - name: dashboard-provider
              mountPath: /otel-lgtm/grafana/conf/provisioning/dashboards/wcf-physics.yml
              subPath: wcf-physics.yml
              readOnly: true
      volumes:
        - name: data
          emptyDir: {}
        - name: dashboards
          configMap:
            name: wcf-physics-dashboards
        - name: dashboard-provider
          configMap:
            name: wcf-physics-dashboard-provider
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: wcf-physics-dashboard-provider
  namespace: wcf-physics
data:
  wcf-physics.yml: |
    apiVersion: 1
    providers:
      - name: wcf-physics
        folder: wcf-physics
        type: file
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: lgtm
  namespace: wcf-physics
  labels:
    app.kubernetes.io/name: lgtm
    app.kubernetes.io/part-of: wcf-physics
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: lgtm
  ports:
    - name: grafana
      port: 3000
      targetPort: 3000
      nodePort: 30091
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
