# k3d cluster wcf-physics: one server node inside Docker.
# Host 8081-8083 map to NodePorts 30081-30083 (dotnet, java, python);
# host 55432 maps to NodePort 30432 (Postgres). The overlay ports 8090
# (Istio ingress gateway, plan step 6) and 8091 (Grafana in otel-lgtm,
# plan step 5) are mapped up front so both overlays need no second recreate.
# Traefik is disabled (platform plan D1): the Istio ingress gateway owns
# ingress when the mesh overlay is installed.
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: wcf-physics
servers: 1
options:
  k3s:
    extraArgs:
      - arg: --disable=traefik
        nodeFilters:
          - server:*
ports:
  - port: 8081:30081
    nodeFilters:
      - server:*
  - port: 8082:30082
    nodeFilters:
      - server:*
  - port: 8083:30083
    nodeFilters:
      - server:*
  - port: 55432:30432
    nodeFilters:
      - server:*
  - port: 8090:30090
    nodeFilters:
      - server:*
  - port: 8091:30091
    nodeFilters:
      - server:*
