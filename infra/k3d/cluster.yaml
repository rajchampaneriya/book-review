# k3d cluster wcf-physics: one server node inside Docker.
# Host 8081-8083 map to NodePorts 30081-30083 (dotnet, java, python);
# host 55432 maps to NodePort 30432 (Postgres).
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: wcf-physics
servers: 1
ports:
  - port: 8081:30081
    nodeFilters:
      - server:*
  - port: 8082:30082
    nodeFilters:
      - server:*
  - port: 8083:30083
    nodeFilters:
      - server:*
  - port: 55432:30432
    nodeFilters:
      - server:*
