# Python stack: image wcf-physics/python:dev, NodePort 30083 (host 8083).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: python
  namespace: wcf-physics
  labels:
    app.kubernetes.io/name: python
    app.kubernetes.io/part-of: wcf-physics
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: python
  template:
    metadata:
      labels:
        app.kubernetes.io/name: python
        wcf-physics.io/identity: python
    spec:
      serviceAccountName: python
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: python
          image: wcf-physics/python:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            # Secret reference, not the inline password (platform plan 3.1);
            # DATABASE_URL is composed from the dependent variables below.
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-local
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-local
                  key: POSTGRES_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: postgres-local
                  key: POSTGRES_DB
            - name: DATABASE_URL
              value: postgresql://$(DB_USER):$(DB_PASSWORD)@postgres:5432/$(DB_NAME)
            - name: DB_SCHEMA
              value: python
            - name: STACK
              value: python
            - name: DB_POOL_SIZE
              value: "10"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 3
          resources:
            requests:
              cpu: "1"
            limits:
              cpu: "2"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: python
  namespace: wcf-physics
  labels:
    app.kubernetes.io/name: python
    app.kubernetes.io/part-of: wcf-physics
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: python
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30083
