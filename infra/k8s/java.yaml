# Java stack: image wcf-physics/java:dev, NodePort 30082 (host 8082).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: java
  namespace: wcf-physics
  labels:
    app.kubernetes.io/name: java
    app.kubernetes.io/part-of: wcf-physics
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: java
  template:
    metadata:
      labels:
        app.kubernetes.io/name: java
        wcf-physics.io/identity: java
    spec:
      containers:
        - name: java
          image: wcf-physics/java:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              value: postgresql://wcf:wcf-local@postgres:5432/bookings
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/bookings
            - name: SPRING_DATASOURCE_USERNAME
              value: wcf
            - name: SPRING_DATASOURCE_PASSWORD
              value: wcf-local
            - name: DB_SCHEMA
              value: java
            - name: STACK
              value: java
            - name: DB_POOL_SIZE
              value: "10"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 3
          resources:
            requests:
              cpu: "1"
            limits:
              cpu: "2"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: java
  namespace: wcf-physics
  labels:
    app.kubernetes.io/name: java
    app.kubernetes.io/part-of: wcf-physics
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: java
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30082
