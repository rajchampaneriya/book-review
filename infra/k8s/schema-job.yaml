# Schema apply Job (platform plan section 3.1): runs the rendered db/schema.sql
# once per stack schema inside the cluster. The SQL arrives in the schema-sql
# ConfigMap, written by infra/scripts/apply-schema.sh, which deletes and
# reapplies this Job (its spec is immutable) and waits for completion.
apiVersion: batch/v1
kind: Job
metadata:
  name: schema-apply
  namespace: wcf-physics
  labels:
    app.kubernetes.io/name: schema-apply
    app.kubernetes.io/part-of: wcf-physics
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: schema-apply
        wcf-physics.io/identity: schema-job
    spec:
      serviceAccountName: schema-job
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: psql
          image: postgres:18.6
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              for stack in dotnet java python; do
                psql -v ON_ERROR_STOP=1 -f /sql/$stack.sql
                echo "schema: applied for '$stack'"
              done
          env:
            - name: PGHOST
              value: postgres
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: postgres-local
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-local
                  key: POSTGRES_PASSWORD
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: postgres-local
                  key: POSTGRES_DB
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: sql
              mountPath: /sql
              readOnly: true
      volumes:
        - name: sql
          configMap:
            name: schema-sql
