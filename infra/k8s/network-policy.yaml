# postgres: the stack services, the Job, the audit and the host's
# harness (NodePort 30432) in on 5432.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres
  namespace: wcf-physics
spec:
  podSelector:
    matchLabels:
      wcf-physics.io/identity: postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              wcf-physics.io/identity: python
        - podSelector:
            matchLabels:
              wcf-physics.io/identity: java
        - podSelector:
            matchLabels:
              wcf-physics.io/identity: dotnet
        - podSelector:
            matchLabels:
              wcf-physics.io/identity: schema-job
        - podSelector:
            matchLabels:
              wcf-physics.io/identity: duplicate-audit
        - ipBlock:
            cidr: 172.23.0.0/16
      ports:
        - protocol: TCP
          port: 5432
    # Mesh overlay: in-mesh traffic reaches postgres from the node's
    # ztunnel, plain on 5432 and HBONE on 15008.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 15008
    - from:
        - ipBlock:
            cidr: 169.254.7.127/32
---
# otel-agent: the node's kube-apiserver (k3s runs it on the node, not in
# a pod) and kubelet, DNS, and the lgtm collector port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-otel-agent
  namespace: wcf-physics
spec:
  podSelector:
    matchLabels:
      wcf-physics.io/identity: otel-agent
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 172.23.0.0/16
      ports:
        - protocol: TCP
          port: 6443
        - protocol: TCP
          port: 10250
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              wcf-physics.io/identity: lgtm
      ports:
        - protocol: TCP
          port: 4317
---
