# lgtm: the collectors in on OTLP, the host in on Grafana (NodePort 30091).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-lgtm
  namespace: wcf-physics
spec:
  podSelector:
    matchLabels:
      wcf-physics.io/identity: lgtm
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              wcf-physics.io/identity: otel-agent
        - podSelector:
            matchLabels:
              wcf-physics.io/identity: otel-cluster
      ports:
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 4318
    - from:
        - ipBlock:
            cidr: 172.23.0.0/16
      ports:
        - protocol: TCP
          port: 3000
---
