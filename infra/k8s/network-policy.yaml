# Mesh overlay, pod to pod. With ambient's in-pod redirection, ztunnel runs
# inside each enrolled pod's network namespace, so HBONE (TCP 15008) leaves
# the calling pod's IP and arrives at the called pod's IP; the node's
# ztunnel pods in istio-system are not on that path. NetworkPolicy sees only
# 15008, so every in-namespace arrow above that carries mesh traffic gets the
# same arrow on 15008 here, on the caller's egress and the callee's ingress.
# Without the mesh nothing listens on 15008 and these rules are inert.
# (Verified 2026-10-17: otel-agent and otel-cluster to lgtm were refused on
# 15008 until the pair below existed.)
#
# Kubelet probes: in ambient they arrive from 169.254.7.127, not the node IP.
# On a dual-stack cluster, also allow fd16:9254:7127:1337:ffff:ffff:ffff:ffff/128.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ambient-health-probes
  namespace: wcf-physics
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock:
            cidr: 169.254.7.127/32
---
# db clients -> postgres (pairs with allow-postgres and the clients' 5432 egress)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ambient-hbone-db-clients-egress
  namespace: wcf-physics
spec:
  podSelector:
    matchExpressions:
      - key: wcf-physics.io/identity
        operator: In
        values: [python, java, dotnet, schema-job, duplicate-audit, otel-cluster]
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              wcf-physics.io/identity: postgres
      ports:
        - port: 15008
          protocol: TCP
---
