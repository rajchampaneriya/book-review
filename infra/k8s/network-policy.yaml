# Default deny, then one allow per permitted connection (platform plan
# section 3.1, arrows on page 5). Sources outside the cluster (k6, the
# harness, the contract tests) reach pods through the k3d node, so the
# host allowance is the docker network subnet 172.23.0.0/16.
#
# Policies select pods by wcf-physics.io/identity, not app.kubernetes.io/name:
# the DaemonSet controller deletes bare pods that carry its selector, so the
# BDD netprobes (which impersonate a workload to test its policy) need a
# label the controllers do not fight over.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: wcf-physics
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# python: host (and later the gateway) in; postgres, DNS and the
# collector out.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-python
  namespace: wcf-physics
spec:
  podSelector:
    matchLabels:
      wcf-physics.io/identity: python
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - ipBlock:
            cidr: 172.23.0.0/16
      ports:
        - protocol: TCP
          port: 8080
    # Mesh overlay: in-mesh traffic arrives from the node's ztunnel on
    # the HBONE port (and plain from it on 8080); ztunnel probes the
    # workload from 169.254.7.127.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 15008
    - from:
        - ipBlock:
            cidr: 169.254.7.127/32
  egress:
    - to:
        - podSelector:
            matchLabels:
              wcf-physics.io/identity: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # App telemetry to the node collector (otel-agent Service, step 5).
    - to:
        - podSelector:
            matchLabels:
              wcf-physics.io/identity: otel-agent
      ports:
        - protocol: TCP
          port: 4317
    # Mesh overlay: outbound HBONE to the node's ztunnel.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
      ports:
        - protocol: TCP
          port: 15008
---
