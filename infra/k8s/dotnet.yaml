# .NET stack: image wcf-physics/dotnet:dev, NodePort 30081 (host 8081).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dotnet
  namespace: wcf-physics
  labels:
    app.kubernetes.io/name: dotnet
    app.kubernetes.io/part-of: wcf-physics
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dotnet
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dotnet
        wcf-physics.io/identity: dotnet
    spec:
      containers:
        - name: dotnet
          image: wcf-physics/dotnet:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              value: postgresql://wcf:wcf-local@postgres:5432/bookings
            - name: DB_SCHEMA
              value: dotnet
            - name: STACK
              value: dotnet
            - name: DB_POOL_SIZE
              value: "10"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 3
          resources:
            requests:
              cpu: "1"
            limits:
              cpu: "2"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: dotnet
  namespace: wcf-physics
  labels:
    app.kubernetes.io/name: dotnet
    app.kubernetes.io/part-of: wcf-physics
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: dotnet
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30081
