# Route timeouts and retries, v2 only (platform plan section 3.2): a mesh
# retry is safe exactly where the idempotency key makes the replay a
# no-op. The naive endpoint gets no retry rule at all — a mesh retry
# there would create the duplicates the experiment attributes to the
# client (gateway.yaml carries the naive route without retries).
#
# backendRequest (1 s) < the fault hook's hold (FAULT_HOLD_MS, default
# 2000): the gateway abandons a held attempt and retries; the committed
# key then replays, which is the point of the experiment.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: v2
  namespace: wcf-physics
spec:
  parentRefs:
    - name: host-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v2/bookings
      timeouts:
        request: 10s
        backendRequest: 1s
      retries:
        codes: [500, 502, 503, 504]
        attempts: 2
        backoff: 200ms
      backendRefs:
        - name: python
          port: 8080
# Weighted routes (platform plan section 3.2): enable when a python-v2
# Service exists, by giving the v2 rule weighted backendRefs:
#   backendRefs:
#     - name: python      port: 8080  weight: 90
#     - name: python-v2   port: 8080  weight: 10
