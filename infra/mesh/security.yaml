# Mesh security (platform plan section 3.2, diagram page 5): STRICT mTLS
# in the namespace, the host-facing PERMISSIVE exceptions from D4 (the
# NodePorts stay plain HTTP for k6, the harness and the contract tests),
# and two AuthorizationPolicies: L4 on postgres (ztunnel-enforced) and
# L7 on python (waypoint-enforced).
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: mesh-strict
  namespace: wcf-physics
spec:
  mtls:
    mode: STRICT
---
# D4 host-facing exception: python keeps accepting plain HTTP through
# NodePort 30083. PERMISSIVE also accepts mTLS, so the gateway path and
# the in-mesh callers stay encrypted.
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: python-host-exception
  namespace: wcf-physics
spec:
  selector:
    matchLabels:
      wcf-physics.io/identity: python
  mtls:
    mode: PERMISSIVE
---
# Same exception for postgres: the harness and the contract tests count
# rows through NodePort 30432 in plain SQL.
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: postgres-host-exception
  namespace: wcf-physics
spec:
  selector:
    matchLabels:
      wcf-physics.io/identity: postgres
  mtls:
    mode: PERMISSIVE
---
# postgres (L4, ztunnel): port 5432 only from the workload identities,
# or from the docker subnet the host harness arrives on (it mirrors the
# allow-postgres NetworkPolicy arrow).
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: postgres-allow
  namespace: wcf-physics
spec:
  selector:
    matchLabels:
      wcf-physics.io/identity: postgres
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/wcf-physics/sa/python
              - cluster.local/ns/wcf-physics/sa/java
              - cluster.local/ns/wcf-physics/sa/dotnet
              - cluster.local/ns/wcf-physics/sa/schema-job
              - cluster.local/ns/wcf-physics/sa/duplicate-audit
      to:
        - operation:
            ports: ["5432"]
    - from:
        - source:
            ipBlocks: ["172.23.0.0/16"]
      to:
        - operation:
            ports: ["5432"]
---
# python (L7, waypoint): only the auto-provisioned gateway's identity
# (cluster.local/ns/wcf-physics/sa/host-gateway-istio) or the host subnet,
# and only the three paths the HTTP contract defines.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: python-allow
  namespace: wcf-physics
spec:
  selector:
    matchLabels:
      wcf-physics.io/identity: python
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/wcf-physics/sa/host-gateway-istio
      to:
        - operation:
            methods: ["POST", "GET"]
            paths: ["/naive/bookings", "/v2/bookings", "/health"]
    - from:
        - source:
            ipBlocks: ["172.23.0.0/16"]
      to:
        - operation:
            methods: ["POST", "GET"]
            paths: ["/naive/bookings", "/v2/bookings", "/health"]
