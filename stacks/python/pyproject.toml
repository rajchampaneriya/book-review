[project]
name = "booking"
version = "0.1.0"
description = "Experiment 3 booking service, FastAPI stack"
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.143.0",
    "uvicorn==0.54.0",
    "asyncpg==0.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "import-linter==2.15",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
